name: Refresh profile language composition

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_language_profile.py             --config brand/config/profile_metrics.json             --output assets/generated/profile/languages.svg

      - name: Commit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/profile/languages.svg
          if git diff --cached --quiet; then
            echo "No metrics change."
          else
            git commit -m "Refresh public portfolio language composition"
            git push
          fi
