</style>
<rect x="3" y="3" width="1194" height="214" rx="30" fill="url(#bg)"/>
<rect x="4" y="4" width="1192" height="212" rx="29" fill="none" stroke="#7f5d2f" stroke-opacity=".72"/>
<text x="56" y="32" class="meta">4 PUBLIC REPOSITORIES · GITHUB LINGUIST BYTES</text>
