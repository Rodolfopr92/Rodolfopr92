<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Rodolfo P. Rodrigues</title>
<desc id="desc">Oxblood and antique gold command center banner for a business systems architect and full-stack AI developer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4efe7"/>
    <stop offset=".48" stop-color="#eadfd3"/>
    <stop offset="1" stop-color="#dac5b8"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".32" r=".62">
    <stop offset="0" stop-color="#7b1830" stop-opacity=".55"/>
    <stop offset=".52" stop-color="#3a0c18" stop-opacity=".22"/>
    <stop offset="1" stop-color="#f4efe7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4dfaa"/>
    <stop offset=".32" stop-color="#c9a45a"/>
    <stop offset=".68" stop-color="#8d682e"/>
    <stop offset="1" stop-color="#e8c978"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#d4b46d" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="goldGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<rect width="1200" height="430" rx="26" fill="url(#grid)"/>
<rect width="1200" height="430" rx="26" fill="url(#glow)"/>
